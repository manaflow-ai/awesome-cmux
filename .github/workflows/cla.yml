name: "CLA Assistant v2"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    # Retargeting and metadata edits both need a fresh CLA result. The signer
    # guard below accepts only open pull requests.
    types: [opened,closed,reopened,synchronize,edited]

# Deny all permissions by default. The signature job grants only the API
# scopes required by the maintained action; the lock job narrows this further.
permissions: {}

jobs:
  CLACommentGate:
    name: "Validate CLA trigger"
    # This job has no write token. Its bounded, repository/event/PR-owned lane
    # prevents unrelated repositories and pull requests from sharing admission
    # state. Removing concurrency would allow unbounded public comment fanout;
    # a unique group per comment would recreate that fanout. GitHub keeps one
    # running and one pending run per group, and its expression comparisons
    # ignore case, so a same-PR case variant can replace the pending run before
    # the exact shell gate rejects it. The contributor must repost. Only a
    # trusted external webhook or App classifier removes that residual.
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.state == 'open' &&
        (
          github.event.action == 'opened' ||
          github.event.action == 'reopened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'edited'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: cla-admission-${{ github.repository }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: "Validate exact CLA trigger"
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_PR_STATE: ${{ github.event.pull_request.state }}
          EVENT_ISSUE_STATE: ${{ github.event.issue.state }}
          EVENT_ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          fail() {
            echo "::error title=CLA trigger policy::${1}"
            exit 1
          }

          sign_phrase='I have read the CLA Document and I hereby sign the CLA'
          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            [[ "${EVENT_ISSUE_STATE}" == "open" && -n "${EVENT_ISSUE_PR_URL}" ]] || fail "The comment is not on an open pull request."
            [[ "${COMMENT_BODY}" == "${sign_phrase}" || "${COMMENT_BODY}" == "recheck" ]] || fail "Use the exact signing comment or the exact recheck command."
          elif [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
            case "${EVENT_ACTION}" in
              opened|reopened|synchronize|edited) ;;
              *) fail "The pull request event is not an accepted CLA trigger." ;;
            esac
            [[ "${EVENT_PR_STATE}" == "open" ]] || fail "The pull request is not open for CLA signing."
          else
            fail "The event is not an accepted CLA trigger."
          fi

  CLAAssistant:
    needs: CLACommentGate
    name: "CLA Assistant v2"
    if: >-
      needs.CLACommentGate.result == 'success' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          github.event.action != 'closed' &&
          github.event.pull_request.state == 'open'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          (
            github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The maintained action's issue-comment workflow-rerun call is
      # best-effort. No Actions permission is granted by design, so required-
      # check recovery remains advisory until an exact-head rerun worker is
      # deployed. The action publishes its result through the job conclusion,
      # not a separate commit-status or check-run API call.
      contents: write
      issues: write
      pull-requests: write
    # Serialize signature and lock writes for this repository and PR only.
    concurrency:
      group: cla-signatures-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: "Check CLA commit history limit"
        # The maintained action admits at most 1,000 commits. Refuse larger
        # pull requests before any signature or comment write.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPO_FULL_NAME: ${{ github.event.repository.full_name }}
          EVENT_REPO_ID: ${{ github.event.repository.id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA preflight failed::Invalid pull request number."
            exit 1
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error title=CLA preflight failed::jq is required to validate live pull request metadata."
            exit 1
          fi

          # Pulls Get nests the source repository ID under head.repo.id.
          pr_endpoint="repos/${GH_REPO}/pulls/${PR_NUMBER}"
          verify_pr_snapshot() {
            local phase="$1"
            local pr_json
            if ! pr_json="$(gh api "${pr_endpoint}" --jq '{base_ref: .base.ref, base_repo_full_name: .base.repo.full_name, base_repo_id: .base.repo.id, head_ref: .head.ref, head_sha: .head.sha, head_repo_full_name: .head.repo.full_name, head_repo_id: .head.repo.id, state: .state, merged: (.merged_at != null), commits: .commits}' 2>/dev/null)"; then
              echo "::error title=CLA ${phase} preflight failed::Unable to query live pull request metadata."
              return 1
            fi

            local base_ref base_repo_full_name base_repo_id
            local head_ref head_sha head_repo_full_name head_repo_id
            local state merged commits
            if ! base_ref="$(jq -er '.base_ref | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${base_ref}" ]]; then
              echo "::error title=CLA ${phase} preflight failed::GitHub returned no valid base branch."
              return 1
            fi
            if ! base_repo_full_name="$(jq -er '.base_repo_full_name | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${base_repo_full_name}" ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid base repository name."
              return 1
            fi
            if ! base_repo_id="$(jq -er '.base_repo_id | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${base_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no positive base repository ID."
              return 1
            fi
            if ! head_repo_full_name="$(jq -er '.head_repo_full_name | strings' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${head_repo_full_name}" =~ ^[^/]+/[^/]+$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid head repository name."
              return 1
            fi
            if ! head_repo_id="$(jq -er '.head_repo_id | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${head_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no positive head repository ID."
              return 1
            fi
            if ! head_sha="$(jq -er '.head_sha | strings' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${head_sha}" =~ ^[0-9A-Fa-f]+$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid head commit."
              return 1
            fi
            if ! head_ref="$(jq -er '.head_ref | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${head_ref}" ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid head ref."
              return 1
            fi
            if ! state="$(jq -er '.state | strings' <<<"${pr_json}" 2>/dev/null)" || [[ "${state}" != "open" ]]; then
              echo "::error title=CLA ${phase} state policy::Pull request is not open."
              return 1
            fi
            if ! merged="$(jq -r '.merged' <<<"${pr_json}" 2>/dev/null)" || [[ "${merged}" != "false" ]]; then
              echo "::error title=CLA ${phase} state policy::Pull request is already merged or has an invalid merge state."
              return 1
            fi
            if ! commits="$(jq -er '.commits | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${commits}" =~ ^[0-9]+$ ]]; then
              echo "::error title=CLA ${phase} commit preflight failed::GitHub returned an invalid commit count."
              return 1
            fi
            # Avoid arithmetic on unbounded attacker-controlled digit strings.
            if (( ${#commits} > 4 )) || { (( ${#commits} == 4 )) && [[ "${commits}" != "1000" ]]; }; then
              echo "::error title=CLA commit history limit::The maintained CLA action admits at most 1000 commits; split or squash this pull request before signing."
              return 1
            fi

            if [[ -z "${EVENT_REPO_FULL_NAME}" || "${EVENT_REPO_FULL_NAME}" != "${GH_REPO}" ]] || ! [[ "${EVENT_REPO_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA ${phase} identity failed::The event repository identity is missing or invalid."
              return 1
            fi
            if [[ "${base_repo_full_name}" != "${GH_REPO}" || "${base_repo_id}" != "${EVENT_REPO_ID}" ]]; then
              echo "::error title=CLA ${phase} identity policy::The live pull request targets a different repository."
              return 1
            fi

            if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
              if [[ -z "${EVENT_HEAD_SHA}" || -z "${EVENT_HEAD_REF}" || -z "${EVENT_HEAD_REPO_FULL_NAME}" || -z "${EVENT_BASE_REPO_FULL_NAME}" || -z "${EVENT_BASE_REF}" ]]; then
                echo "::error title=CLA ${phase} identity failed::The pull_request_target payload is missing repository identity."
                return 1
              fi
              if ! [[ "${EVENT_HEAD_REPO_ID}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${EVENT_BASE_REPO_ID}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error title=CLA ${phase} identity failed::The pull_request_target payload has an invalid repository ID."
                return 1
              fi
              if ! [[ "${EVENT_HEAD_SHA}" =~ ^[0-9A-Fa-f]+$ ]]; then
                echo "::error title=CLA ${phase} identity failed::The pull_request_target payload has an invalid head commit."
                return 1
              fi
              if [[ "${EVENT_HEAD_SHA}" != "${head_sha}" || "${EVENT_HEAD_REF}" != "${head_ref}" || "${EVENT_HEAD_REPO_FULL_NAME}" != "${head_repo_full_name}" || "${EVENT_HEAD_REPO_ID}" != "${head_repo_id}" ]]; then
                echo "::error title=CLA ${phase} identity policy::The pull_request_target head identity is stale."
                return 1
              fi
              if [[ "${EVENT_BASE_REPO_FULL_NAME}" != "${base_repo_full_name}" || "${EVENT_BASE_REPO_ID}" != "${base_repo_id}" || "${EVENT_BASE_REF}" != "${base_ref}" ]]; then
                echo "::error title=CLA ${phase} identity policy::The pull_request_target base identity is stale."
                return 1
              fi
            fi

            if [[ "${base_ref}" != "main" ]]; then
              echo "::error title=CLA base branch policy::CLA Assistant only accepts pull requests targeting main."
              return 1
            fi
            echo "CLA ${phase} pull request identity verified."
          }

          verify_pr_snapshot "initial"
          # Re-fetch immediately before the action to reject a stale head or repository identity.
          verify_pr_snapshot "final"

      - name: "Validate CLA comment spelling"
        # GitHub expression equality is case-insensitive. Recheck the exact
        # electronic-signature body in a trusted shell before the action runs.
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          if [[ "${EVENT_NAME}" != 'issue_comment' ]]; then
            exit 0
          fi
          sign_phrase='I have read the CLA Document and I hereby sign the CLA'
          if [[ "${COMMENT_BODY}" != "${sign_phrase}" && "${COMMENT_BODY}" != 'recheck' ]]; then
            echo "::error title=CLA comment policy::Use the exact signing comment or the exact recheck command."
            exit 1
          fi

      - name: "CLA Assistant v2"
        # The action handles signing and status updates. Keep its lock path
        # disabled and use the explicit merged-PR lock step below. The
        # maintained action exact-matches raw bodies and bounds comment
        # pagination at 1,000 entries.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        # Maintained Manaflow fork generation: v2.2-action-bc206ed9b52ad0b0cbe85244ce522e5e9b65c10e
        uses: manaflow-ai/cla-github-action@bc206ed9b52ad0b0cbe85244ce522e5e9b65c10e # v0.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Pin the displayed document to the workflow revision that started
          # this run, so a later default-branch edit cannot change the terms
          # after a contributor signs.
          path-to-document: 'https://github.com/manaflow-ai/awesome-cmux/blob/${{ github.workflow_sha }}/CLA.md'
          # Keep locking in the separate issues-only job below. It validates the
          # merged PR identity before supplying the resolved lock reason.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          required-base-ref: 'main'
          # Require the authenticated PR opener to appear as a commit author
          # or co-author. This blocks forged commit identity bypasses.
          require-opener-as-author: 'true'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The live validation reads /pulls/{number}; GitHub requires this
      # read scope separately from the issue lock write scope.
      pull-requests: read
      issues: write
    # Keep merged-PR lock writes in a separate per-repository/per-PR lane.
    # A lock must not replace a pending signer run, and vice versa.
    concurrency:
      group: cla-lock-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: "Validate merged pull request identity"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_REPO_FULL_NAME: ${{ github.event.repository.full_name }}
          EVENT_REPO_ID: ${{ github.event.repository.id }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_STATE: ${{ github.event.pull_request.state }}
          EVENT_PR_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_OPENER_LOGIN: ${{ github.event.pull_request.user.login }}
          EVENT_OPENER_ID: ${{ github.event.pull_request.user.id }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error title=CLA merged pull request validation::${1}"
            exit 1
          }

          is_positive_safe_integer() {
            local value="$1"
            [[ "${value}" =~ ^[1-9][0-9]*$ ]] || return 1
            if (( ${#value} < 16 )); then
              return 0
            fi
            if (( ${#value} == 16 )); then
              (( 10#${value} <= 9007199254740991 ))
              return
            fi
            return 1
          }

          if [[ "${EVENT_NAME}" != "pull_request_target" || "${EVENT_ACTION}" != "closed" ]]; then
            fail "The lock job received an unexpected event."
          fi
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] || [[ "${EVENT_PR_NUMBER}" != "${PR_NUMBER}" ]]; then
            fail "The event has an invalid or mismatched pull request number."
          fi
          if [[ "${EVENT_PR_STATE}" != "closed" || "${EVENT_PR_MERGED}" != "true" ]]; then
            fail "The event is not a closed merged pull request."
          fi
          if [[ -z "${EVENT_REPO_FULL_NAME}" || "${EVENT_REPO_FULL_NAME,,}" != "${GH_REPO,,}" ]] || ! is_positive_safe_integer "${EVENT_REPO_ID}"; then
            fail "The event repository identity is missing or invalid."
          fi
          if [[ -z "${EVENT_BASE_REF}" || "${EVENT_BASE_REF}" != "main" || -z "${EVENT_BASE_REPO_FULL_NAME}" || "${EVENT_BASE_REPO_FULL_NAME,,}" != "${GH_REPO,,}" ]] || ! is_positive_safe_integer "${EVENT_BASE_REPO_ID}"; then
            fail "The event base repository identity is missing or invalid."
          fi
          if [[ -z "${EVENT_OPENER_LOGIN}" ]] || ! is_positive_safe_integer "${EVENT_OPENER_ID}"; then
            fail "The event opener identity is missing or invalid."
          fi

          pr_endpoint="repos/${GH_REPO}/pulls/${PR_NUMBER}"
          if ! pr_json="$(gh api "${pr_endpoint}" --jq '{number: .number, state: .state, merged: (.merged_at != null), base_ref: .base.ref, base_repo_full_name: .base.repo.full_name, base_repo_id: .base.repo.id, head_sha: .head.sha, head_ref: .head.ref, head_repo_full_name: (.head.repo.full_name // null), head_repo_id: (.head.repo.id // null), opener_login: .user.login, opener_id: .user.id}' 2>/dev/null)"; then
            fail "Unable to query the live pull request."
          fi
          if ! jq -e '
            def safe_id:
              type == "number" and . > 0 and . <= 9007199254740991 and (floor == .);
            type == "object" and
            (.number | safe_id) and
            (.state | type) == "string" and (.state | length) > 0 and
            (.merged | type) == "boolean" and
            (.base_ref | type) == "string" and (.base_ref | length) > 0 and
            (.base_repo_full_name | type) == "string" and (.base_repo_full_name | length) > 0 and
            (.base_repo_id | safe_id) and
            (.head_sha | type) == "string" and (.head_sha | test("^[0-9A-Fa-f]+$")) and
            (.head_ref | type) == "string" and (.head_ref | length) > 0 and
            ((.head_repo_full_name == null and .head_repo_id == null) or
              ((.head_repo_full_name | type) == "string" and (.head_repo_full_name | length) > 0 and (.head_repo_id | safe_id))) and
            (.opener_login | type) == "string" and (.opener_login | length) > 0 and
            (.opener_id | safe_id)
          ' <<<"${pr_json}" >/dev/null 2>/dev/null; then
            fail "The live pull request has an invalid identity or head structure."
          fi

          live_number="$(jq -er '.number | floor | tostring' <<<"${pr_json}")"
          live_state="$(jq -er '.state' <<<"${pr_json}")"
          live_merged="$(jq -er '.merged' <<<"${pr_json}")"
          live_base_ref="$(jq -er '.base_ref' <<<"${pr_json}")"
          live_base_repo_full_name="$(jq -er '.base_repo_full_name' <<<"${pr_json}")"
          live_base_repo_id="$(jq -er '.base_repo_id | floor | tostring' <<<"${pr_json}")"
          live_head_sha="$(jq -er '.head_sha' <<<"${pr_json}")"
          live_head_ref="$(jq -er '.head_ref' <<<"${pr_json}")"
          live_opener_login="$(jq -er '.opener_login' <<<"${pr_json}")"
          live_opener_id="$(jq -er '.opener_id | floor | tostring' <<<"${pr_json}")"
          live_head_repo_full_name="$(jq -r '.head_repo_full_name // empty' <<<"${pr_json}")"
          live_head_repo_id="$(jq -r 'if .head_repo_id == null then empty else (.head_repo_id | floor | tostring) end' <<<"${pr_json}")"

          [[ "${live_number}" == "${PR_NUMBER}" ]] || fail "The live pull request number does not match the event."
          [[ "${live_state}" == "closed" && "${live_merged}" == "true" ]] || fail "The live pull request is not closed and merged."
          [[ "${live_base_ref}" == "main" && "${EVENT_BASE_REF}" == "${live_base_ref}" ]] || fail "The live base branch does not match main."
          [[ "${live_base_repo_full_name,,}" == "${GH_REPO,,}" && "${EVENT_BASE_REPO_FULL_NAME,,}" == "${live_base_repo_full_name,,}" ]] || fail "The live base repository does not match the event repository."
          is_positive_safe_integer "${live_base_repo_id}" || fail "The live base repository ID is invalid."
          [[ "${live_base_repo_id}" == "${EVENT_REPO_ID}" && "${live_base_repo_id}" == "${EVENT_BASE_REPO_ID}" ]] || fail "The live base repository ID does not match the event."
          [[ "${live_opener_login,,}" == "${EVENT_OPENER_LOGIN,,}" ]] || fail "The live opener does not match the event."
          is_positive_safe_integer "${live_opener_id}" || fail "The live opener ID is invalid."
          [[ "${live_opener_id}" == "${EVENT_OPENER_ID}" ]] || fail "The live opener ID does not match the event."
          # A merged PR's source branch can advance or its source repository can
          # be deleted. Validate the live head shape, but do not compare it to
          # the closed-event head fields.
          [[ -n "${live_head_sha}" && "${live_head_sha}" =~ ^[0-9A-Fa-f]+$ && -n "${live_head_ref}" ]] || fail "The live head structure is invalid."
          if [[ -n "${live_head_repo_full_name}" || -n "${live_head_repo_id}" ]]; then
            [[ -n "${live_head_repo_full_name}" ]] || fail "The live head repository name is missing."
            is_positive_safe_integer "${live_head_repo_id}" || fail "The live head repository ID is invalid."
          fi
          echo "CLA merged pull request identity verified."

      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock lookup::Unable to query lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$locked" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          if [[ "$locked" != "false" ]]; then
            echo "::error title=CLA lock lookup::GitHub returned an invalid lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>/dev/null; then
            echo "::error title=CLA lock request::Unable to lock merged pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock verification::Unable to verify lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$locked" != "true" ]]; then
            echo "::error title=CLA lock verification::Pull request ${PR_NUMBER} was not locked after the lock request."
            exit 1
          fi
