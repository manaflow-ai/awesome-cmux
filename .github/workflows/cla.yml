name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,closed,reopened,synchronize]

# Deny all permissions by default. The signature job grants only the API
# scopes required by the archived action; the lock job narrows this further.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant"
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    # Signature and lock writes share repository state. Queue every pending
    # event so a newer comment cannot silently replace an earlier request.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    steps:
      - name: "Check CLA commit history limit"
        # The archived action only inspects its first 100 commits. Refuse
        # larger pull requests instead of allowing unsigned committers through.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA commit history lookup::Invalid pull request number: ${PR_NUMBER}."
            exit 1
          fi
          pr_endpoint="repos/${GH_REPO}/pulls/${PR_NUMBER}"
          if ! base_ref="$(gh api "$pr_endpoint" --jq '.base.ref' 2>/dev/null)"; then
            echo "::error title=CLA base branch lookup::Unable to query the base branch for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$base_ref" != "main" ]]; then
            echo "::error title=CLA base branch policy::CLA Assistant only accepts pull requests targeting main; pull request ${PR_NUMBER} targets ${base_ref}."
            exit 1
          fi
          if ! commits="$(gh api "$pr_endpoint" --jq '.commits' 2>/dev/null)"; then
            echo "::error title=CLA commit history lookup::Unable to query pull request ${PR_NUMBER} for its commit count."
            exit 1
          fi
          if ! [[ "$commits" =~ ^[0-9]+$ ]]; then
            echo "::error title=CLA commit history lookup::GitHub returned a non-numeric commit count for pull request ${PR_NUMBER}."
            exit 1
          fi
          if (( commits > 100 )); then
            echo "::error title=CLA commit history limit::CLA Assistant inspects only the first 100 commits; split or squash pull request ${PR_NUMBER} before signing."
            exit 1
          fi
          echo "CLA commit history count: ${commits}"

      - name: "CLA Assistant"
        # The action handles signing and status updates. Merged pull requests
        # use the explicit lock step below because the archived action sends
        # an invalid lock request.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Pin the displayed document to the workflow revision that started
          # this run, so a later default-branch edit cannot change the terms
          # after a contributor signs.
          path-to-document: 'https://github.com/manaflow-ai/awesome-cmux/blob/${{ github.workflow_sha }}/CLA.md'
          # The archived action calls the lock endpoint without the required
          # lock_reason. Disable that broken path and use the explicit step
          # below, which supplies a valid reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Serialize lock writes with signature writes in the same bounded queue.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock lookup::Unable to query lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$locked" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>/dev/null; then
            echo "::error title=CLA lock request::Unable to lock merged pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock verification::Unable to verify lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$locked" != "true" ]]; then
            echo "::error title=CLA lock verification::Pull request ${PR_NUMBER} was not locked after the lock request."
            exit 1
          fi
