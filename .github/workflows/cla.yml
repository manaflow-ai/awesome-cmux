name: "CLA Assistant v2"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main]
    types: [opened,closed,reopened,synchronize]

# Deny all permissions by default. The signature job grants only the API
# scopes required by the archived action; the lock job narrows this further.
permissions: {}

jobs:
  CLAAssistant:
    name: "CLA Assistant v2"
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The archived action's branch-based rerun is unsafe. The exact-head
      # rerun worker is not deployed yet, so required-check recovery is advisory.
      actions: read
      contents: write
      issues: write
      pull-requests: write
    # Signature and lock writes share repository state. Queue every pending
    # event so a newer comment cannot silently replace an earlier request.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    steps:
      - name: "Check CLA commit history limit"
        # The archived action only inspects its first 100 commits. Refuse
        # larger pull requests instead of allowing unsigned committers through.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPO_FULL_NAME: ${{ github.event.repository.full_name }}
          EVENT_REPO_ID: ${{ github.event.repository.id }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
          EVENT_BASE_REPO_FULL_NAME: ${{ github.event.pull_request.base.repo.full_name }}
          EVENT_BASE_REPO_ID: ${{ github.event.pull_request.base.repo.id }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA preflight failed::Invalid pull request number."
            exit 1
          fi

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error title=CLA preflight failed::jq is required to validate live pull request metadata."
            exit 1
          fi

          pr_endpoint="repos/${GH_REPO}/pulls/${PR_NUMBER}"
          verify_pr_snapshot() {
            local phase="$1"
            local pr_json
            if ! pr_json="$(gh api "${pr_endpoint}" --jq '{base_ref: .base.ref, base_repo_full_name: .base.repo.full_name, base_repo_id: .base.repo.id, head_ref: .head.ref, head_sha: .head.sha, head_repo_full_name: .head.repo.full_name, head_repo_id: .head.repo.id, state: .state, merged: (.merged_at != null), commits: .commits}' 2>/dev/null)"; then
              echo "::error title=CLA ${phase} preflight failed::Unable to query live pull request metadata."
              return 1
            fi

            local base_ref base_repo_full_name base_repo_id
            local head_ref head_sha head_repo_full_name head_repo_id
            local state merged commits
            if ! base_ref="$(jq -er '.base_ref | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${base_ref}" ]]; then
              echo "::error title=CLA ${phase} preflight failed::GitHub returned no valid base branch."
              return 1
            fi
            if ! base_repo_full_name="$(jq -er '.base_repo_full_name | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${base_repo_full_name}" ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid base repository name."
              return 1
            fi
            if ! base_repo_id="$(jq -er '.base_repo_id | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${base_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no positive base repository ID."
              return 1
            fi
            if ! head_repo_full_name="$(jq -er '.head_repo_full_name | strings' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${head_repo_full_name}" =~ ^[^/]+/[^/]+$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid head repository name."
              return 1
            fi
            if ! head_repo_id="$(jq -er '.head_repo_id | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${head_repo_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no positive head repository ID."
              return 1
            fi
            if ! head_sha="$(jq -er '.head_sha | strings' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${head_sha}" =~ ^[0-9A-Fa-f]+$ ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid head commit."
              return 1
            fi
            if ! head_ref="$(jq -er '.head_ref | strings' <<<"${pr_json}" 2>/dev/null)" || [[ -z "${head_ref}" ]]; then
              echo "::error title=CLA ${phase} identity failed::GitHub returned no valid head ref."
              return 1
            fi
            if ! state="$(jq -er '.state | strings' <<<"${pr_json}" 2>/dev/null)" || [[ "${state}" != "open" ]]; then
              echo "::error title=CLA ${phase} state policy::Pull request is not open."
              return 1
            fi
            if ! merged="$(jq -r '.merged' <<<"${pr_json}" 2>/dev/null)" || [[ "${merged}" != "false" ]]; then
              echo "::error title=CLA ${phase} state policy::Pull request is already merged or has an invalid merge state."
              return 1
            fi
            if ! commits="$(jq -er '.commits | numbers' <<<"${pr_json}" 2>/dev/null)" || ! [[ "${commits}" =~ ^[0-9]+$ ]]; then
              echo "::error title=CLA ${phase} commit preflight failed::GitHub returned an invalid commit count."
              return 1
            fi
            if (( commits > 100 )); then
              echo "::error title=CLA commit history limit::CLA Assistant inspects only the first 100 commits; split or squash this pull request before signing."
              return 1
            fi

            if [[ -z "${EVENT_REPO_FULL_NAME}" || "${EVENT_REPO_FULL_NAME}" != "${GH_REPO}" ]] || ! [[ "${EVENT_REPO_ID}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error title=CLA ${phase} identity failed::The event repository identity is missing or invalid."
              return 1
            fi
            if [[ "${base_repo_full_name}" != "${GH_REPO}" || "${base_repo_id}" != "${EVENT_REPO_ID}" ]]; then
              echo "::error title=CLA ${phase} identity policy::The live pull request targets a different repository."
              return 1
            fi

            if [[ "${EVENT_NAME}" == "pull_request_target" ]]; then
              if [[ -z "${EVENT_HEAD_SHA}" || -z "${EVENT_HEAD_REF}" || -z "${EVENT_HEAD_REPO_FULL_NAME}" || -z "${EVENT_BASE_REPO_FULL_NAME}" || -z "${EVENT_BASE_REF}" ]]; then
                echo "::error title=CLA ${phase} identity failed::The pull_request_target payload is missing repository identity."
                return 1
              fi
              if ! [[ "${EVENT_HEAD_REPO_ID}" =~ ^[1-9][0-9]*$ ]] || ! [[ "${EVENT_BASE_REPO_ID}" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error title=CLA ${phase} identity failed::The pull_request_target payload has an invalid repository ID."
                return 1
              fi
              if ! [[ "${EVENT_HEAD_SHA}" =~ ^[0-9A-Fa-f]+$ ]]; then
                echo "::error title=CLA ${phase} identity failed::The pull_request_target payload has an invalid head commit."
                return 1
              fi
              if [[ "${EVENT_HEAD_SHA}" != "${head_sha}" || "${EVENT_HEAD_REF}" != "${head_ref}" || "${EVENT_HEAD_REPO_FULL_NAME}" != "${head_repo_full_name}" || "${EVENT_HEAD_REPO_ID}" != "${head_repo_id}" ]]; then
                echo "::error title=CLA ${phase} identity policy::The pull_request_target head identity is stale."
                return 1
              fi
              if [[ "${EVENT_BASE_REPO_FULL_NAME}" != "${base_repo_full_name}" || "${EVENT_BASE_REPO_ID}" != "${base_repo_id}" || "${EVENT_BASE_REF}" != "${base_ref}" ]]; then
                echo "::error title=CLA ${phase} identity policy::The pull_request_target base identity is stale."
                return 1
              fi
            fi

            if [[ "${base_ref}" != "main" ]]; then
              echo "::error title=CLA base branch policy::CLA Assistant only accepts pull requests targeting main."
              return 1
            fi
            echo "CLA ${phase} pull request identity verified."
          }

          verify_pr_snapshot "initial"
          # Re-fetch immediately before the action to reject a stale head or repository identity.
          verify_pr_snapshot "final"

      - name: "Validate CLA comment spelling"
        # GitHub expression equality is case-insensitive and the archived
        # action accepts broad comment matches. Recheck in a trusted shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          if [[ "${EVENT_NAME}" != 'issue_comment' ]]; then
            exit 0
          fi
          sign_phrase='I have read the CLA Document and I hereby sign the CLA'
          if [[ "${COMMENT_BODY}" != "${sign_phrase}" && "${COMMENT_BODY}" != 'recheck' ]]; then
            echo "::error title=CLA comment policy::Use the exact signing comment or the exact recheck command."
            exit 1
          fi

      - name: "Audit historical CLA comments"
        # The archived action normalizes historical comments and can accept a
        # broad CLA phrase. Inspect every comment before it can write a
        # signature. The canonical github-actions[bot] marker is ignored.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != 'pull_request_target' && "${EVENT_NAME}" != 'issue_comment' ]]; then
            exit 0
          fi
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=CLA comment audit failed::Invalid pull request number."
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error title=CLA comment audit failed::jq is required to validate historical comments."
            exit 1
          fi

          comments_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}/comments"
          exact_sign_phrase='I have read the CLA Document and I hereby sign the CLA'
          broad_pattern='^.*i\s*have\s*read\s*the\s*cla\s*document\s*and\s*i\s*hereby\s*sign\s*the\s*cla.*$'
          page=1
          while (( page <= 10 )); do
            if ! page_json="$(gh api "${comments_endpoint}?per_page=100&page=${page}" --jq '.' 2>/dev/null)"; then
              echo "::error title=CLA comment audit failed::Unable to query pull request comments."
              exit 1
            fi
            if ! page_count="$(jq -er 'if type == "array" then length else error("not an array") end' <<<"${page_json}" 2>/dev/null)" || ! [[ "${page_count}" =~ ^[0-9]+$ ]] || (( page_count > 100 )); then
              echo "::error title=CLA comment audit failed::GitHub returned an invalid comment page."
              exit 1
            fi
            if ! jq -e '
              type == "array" and
              all(.[]; (
                type == "object" and
                (.body | type) == "string" and
                (.user | type) == "object" and
                (.user.login | type) == "string" and
                (.user.type | type) == "string"
              ))
            ' <<<"${page_json}" >/dev/null 2>/dev/null; then
              echo "::error title=CLA comment audit failed::GitHub returned a comment with invalid author or body data."
              exit 1
            fi
            if ! counts_json="$(jq -e --arg exact "${exact_sign_phrase}" --arg pattern "${broad_pattern}" '
              [
                .[]
                | .body as $raw
                | .user as $user
                | ($raw | ascii_downcase | sub("^\\s+"; "") | sub("\\s+$"; "")) as $normalized
                | select($normalized | test($pattern))
                | select($user.login != "github-actions[bot]")
                | select(($raw != $exact) or ($user.type != "User"))
                | {
                    non_exact: ($raw != $exact),
                    non_human: ($user.type != "User")
                  }
              ] as $candidates
              | {
                  non_exact: ([$candidates[] | select(.non_exact)] | length),
                  non_human: ([$candidates[] | select(.non_human)] | length),
                  total: ($candidates | length)
                }
            ' <<<"${page_json}" 2>/dev/null)"; then
              echo "::error title=CLA comment audit failed::Unable to validate historical comment text."
              exit 1
            fi
            if ! non_exact_count="$(jq -er '.non_exact | numbers' <<<"${counts_json}" 2>/dev/null)" || ! [[ "${non_exact_count}" =~ ^[0-9]+$ ]]; then
              echo "::error title=CLA comment audit failed::The historical comment audit returned an invalid non-exact count."
              exit 1
            fi
            if ! non_human_count="$(jq -er '.non_human | numbers' <<<"${counts_json}" 2>/dev/null)" || ! [[ "${non_human_count}" =~ ^[0-9]+$ ]]; then
              echo "::error title=CLA comment audit failed::The historical comment audit returned an invalid author count."
              exit 1
            fi
            if ! candidate_count="$(jq -er '.total | numbers' <<<"${counts_json}" 2>/dev/null)" || ! [[ "${candidate_count}" =~ ^[0-9]+$ ]]; then
              echo "::error title=CLA comment audit failed::The historical comment audit returned an invalid candidate count."
              exit 1
            fi
            if (( candidate_count > 0 )); then
              echo "::error title=CLA comment policy::Found ${non_exact_count} non-exact and ${non_human_count} non-human historical CLA candidate comment(s); only an exact human signature is accepted."
              exit 1
            fi
            if (( page_count < 100 )); then
              break
            fi
            page=$((page + 1))
          done

          if (( page == 11 )); then
            if ! overflow_json="$(gh api "${comments_endpoint}?per_page=1&page=11" --jq '.' 2>/dev/null)"; then
              echo "::error title=CLA comment history limit::Unable to verify the 1000-comment limit."
              exit 1
            fi
            if ! overflow_count="$(jq -er 'if type == "array" then length else error("not an array") end' <<<"${overflow_json}" 2>/dev/null)" || ! [[ "${overflow_count}" =~ ^[0-9]+$ ]] || (( overflow_count > 1 )); then
              echo "::error title=CLA comment history limit::GitHub returned an invalid overflow page."
              exit 1
            fi
            if (( overflow_count > 0 )); then
              echo "::error title=CLA comment history limit::This pull request has more than 1000 comments; archive or split the discussion before CLA verification."
              exit 1
            fi
          fi
          echo "CLA historical comment audit passed."

      - name: "CLA Assistant v2"
        # The action handles signing and status updates. Merged pull requests
        # use the explicit lock step below because the archived action sends
        # an invalid lock request.
        if: >-
          (
            github.event_name == 'pull_request_target' &&
            github.event.action != 'closed'
          ) ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            github.event.issue.state == 'open' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Pin the displayed document to the workflow revision that started
          # this run, so a later default-branch edit cannot change the terms
          # after a contributor signs.
          path-to-document: 'https://github.com/manaflow-ai/awesome-cmux/blob/${{ github.workflow_sha }}/CLA.md'
          # The archived action calls the lock endpoint without the required
          # lock_reason. Disable that broken path and use the explicit step
          # below, which supplies a valid reason and fails on API errors.
          lock-pullrequest-aftermerge: 'false'
          # signatures live on the unprotected cla-signatures branch so required checks on main don't block the bot's signature commits
          branch: 'cla-signatures'
          required-base-ref: 'main'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'

  LockMergedPullRequest:
    name: "Lock merged pull request"
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    # Serialize lock writes with signature writes in the same bounded queue.
    concurrency:
      group: cla-signatures
      queue: max
      cancel-in-progress: false
    steps:
      - name: "Lock merged pull request"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_endpoint="repos/${GH_REPO}/issues/${PR_NUMBER}"
          lock_endpoint="${issue_endpoint}/lock"
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock lookup::Unable to query lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$locked" == "true" ]]; then
            echo "Pull request ${PR_NUMBER} is already locked"
            exit 0
          fi
          if [[ "$locked" != "false" ]]; then
            echo "::error title=CLA lock lookup::GitHub returned an invalid lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! gh api --method PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${lock_endpoint}" \
            --field lock_reason=resolved >/dev/null 2>/dev/null; then
            echo "::error title=CLA lock request::Unable to lock merged pull request ${PR_NUMBER}."
            exit 1
          fi
          if ! locked="$(gh api "${issue_endpoint}" --jq '.locked' 2>/dev/null)"; then
            echo "::error title=CLA lock verification::Unable to verify lock state for pull request ${PR_NUMBER}."
            exit 1
          fi
          if [[ "$locked" != "true" ]]; then
            echo "::error title=CLA lock verification::Pull request ${PR_NUMBER} was not locked after the lock request."
            exit 1
          fi
